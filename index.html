<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Personal Trainer IA</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>

  <!-- PANTALLA DE CONFIGURACIÓN -->
  <div id="setup-screen">
    <h1>🏋️ Personal Trainer IA</h1>
    <p>Configurá tu entrenamiento</p>
    
    <div class="form-group">
      <label for="exercise-select">Ejercicio:</label>
      <select id="exercise-select">
        <option value="curl">Curl de Bíceps</option>
        <option value="squat">Sentadilla</option>
        <option value="pushup">Flexiones</option>
        <option value="bench_press">Press de Banca</option>
        <option value="incline_press">Press Inclinado</option>
        <option value="lat_pulldown">Jalón al Pecho</option>
        <option value="seated_row">Remo en V</option>
      </select>
      <button id="btn-help" class="btn-help">❓ Cómo ubicar el celular</button>
    </div>

    <div class="form-group">
      <label for="sets-input">Series:</label>
      <input type="number" id="sets-input" value="3" min="1" max="10">
    </div>

    <div class="form-group">
      <label for="reps-input">Repeticiones:</label>
      <input type="number" id="reps-input" value="10" min="1" max="50">
    </div>

    <button id="btn-start" class="btn-primary">▶️ Iniciar Entrenamiento</button>
  </div>

  <!-- MODAL DE INSTRUCCIONES -->
  <div id="help-modal" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h2 id="modal-title">Instrucciones</h2>
      <div id="modal-body" class="modal-body"></div>
      <button id="btn-close-modal" class="btn-primary">Entendido</button>
    </div>
  </div>

  <!-- PANTALLA DE ENTRENAMIENTO -->
  <div id="workout-screen" style="display: none;">
    <div class="top-bar">
      <button id="btn-back" class="btn-small">⬅️ Salir</button>
      <div id="workout-info" class="info-text">Serie 1/3 | Rep 0/10</div>
    </div>

    <div class="feedback" id="feedback">Preparando...</div>
    
    <div class="video-wrapper">
      <div class="video-container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
      </div>
    </div>
    
    <div class="controls">
      <button id="btn-rotate" class="btn-small">🔄 Cambiar Cámara</button>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
  <script src="script.js?v=12"></script>
</body>
</html>
