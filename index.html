<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Personal Trainer IA</title>
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>

  <!-- PANTALLA DE CONFIGURACIÓN -->
  <div id="setup-screen">
    <h1 class="main-title">
      Personal Trainer <span class="title-ia">IA</span>
    </h1>
    <p class="subtitle">Configurá tu entrenamiento</p>

    <div class="main-card">
      <!-- Tabs de categorías -->
      <div class="category-tabs">
        <button class="tab active" data-category="full">
          <span class="tab-icon">🧍</span>
          <span>Cuerpo Completo</span>
        </button>
        <button class="tab" data-category="upper">
          <span class="tab-icon">💪</span>
          <span>Superior</span>
        </button>
        <button class="tab" data-category="lower">
          <span class="tab-icon">🦵</span>
          <span>Inferior</span>
        </button>
      </div>

      <!-- Buscador de ejercicio -->
      <div class="search-container">
        <label class="field-label">Ejercicio:</label>
        <div class="search-box">
          <input type="text" id="exercise-search" placeholder="Buscar ejercicio..." autocomplete="off">
          <span class="search-icon">🔍</span>
        </div>
        <div id="search-results" class="search-results"></div>
        <select id="exercise-select" class="hidden-select">
          <option value="curl">Curl de Bíceps</option>
          <option value="squat">Sentadilla</option>
          <option value="pushup">Flexiones</option>
          <option value="bench_press">Press de Banca</option>
          <option value="incline_press">Press Inclinado</option>
          <option value="lat_pulldown">Jalón al Pecho</option>
          <option value="seated_row">Remo en V</option>
        </select>
        <div id="selected-exercise" class="selected-exercise">Curl de Bíceps 💪</div>
      </div>

      <!-- Botón de guía -->
      <button id="btn-help" class="btn-guide">
        <span class="guide-icon">📱</span>
        <span>Guía de ubicación del celular</span>
        <span class="info-badge">ℹ️</span>
      </button>

      <!-- Series y Repeticiones con botones +/- -->
      <div class="counters-row">
        <div class="counter-group">
          <label class="field-label">Series: <span class="field-sub">set</span></label>
          <div class="counter-controls">
            <button class="btn-minus" data-target="sets">−</button>
            <div class="counter-value" id="sets-display">3</div>
            <button class="btn-plus" data-target="sets">+</button>
          </div>
        </div>
        <div class="counter-group">
          <label class="field-label">Repeticiones: <span class="field-sub">rep</span></label>
          <div class="counter-controls">
            <button class="btn-minus" data-target="reps">−</button>
            <div class="counter-value" id="reps-display">10</div>
            <button class="btn-plus" data-target="reps">+</button>
          </div>
        </div>
      </div>

      <!-- Botón iniciar -->
      <button id="btn-start" class="btn-start">
        <span class="play-icon">▶</span>
        Iniciar Entrenamiento
      </button>
    </div>
  </div>

  <!-- MODAL DE INSTRUCCIONES -->
  <div id="help-modal" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h2 id="modal-title">Instrucciones</h2>
      <div id="modal-body" class="modal-body"></div>
      <button id="btn-close-modal" class="btn-primary">Entendido</button>
    </div>
  </div>

  <!-- PANTALLA DE ENTRENAMIENTO -->
  <div id="workout-screen" style="display: none;">
    <div class="video-wrapper">
      <div class="video-container">
        
        <!-- Overlay: Feedback (arriba centrado) -->
        <div class="overlay-feedback" id="feedback">Preparando...</div>
        
        <!-- Overlay: Contador (arriba izquierda) -->
        <div class="overlay-counter" id="overlay-counter">
          Serie 1/3 | Rep 0
        </div>
        
        <!-- Overlay: Botón cambiar cámara (arriba derecha) -->
        <button id="btn-rotate-overlay" class="overlay-btn" title="Cambiar cámara">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 4v6h-6"/>
            <path d="M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
            <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/>
          </svg>
        </button>
        
        <!-- Overlay: Botón salir (abajo izquierda) -->
        <button id="btn-back" class="overlay-btn bottom-left" title="Salir">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"/>
            <path d="M12 19l-7-7 7-7"/>
          </svg>
        </button>
        
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
      </div>
    </div>
    
    <!-- Controles inferiores dinámicos -->
    <div class="controls" id="controls-bottom" style="display: none;">
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
  <script src="script.js?v=16"></script>
</body>
</html>
